services:
  postgres:
    image: postgres:16-alpine
    container_name: teamspace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamspace
      POSTGRES_PASSWORD: teamspace_dev_pwd
      POSTGRES_DB: teamspace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamspace -d teamspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: teamspace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

volumes:
  pgdata:
